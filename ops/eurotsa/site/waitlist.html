<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qualified EU Timestamps — coming soon</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 480px; margin: 80px auto; padding: 0 20px; color: #1a1a1a; line-height: 1.6; text-align: center; }
  h1 { font-size: 1.4rem; }
  p { color: #444; }
  form { margin-top: 24px; display: flex; gap: 8px; }
  input[type="email"] { flex: 1; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
  button { padding: 10px 18px; border: none; border-radius: 6px; background: #1a1a1a; color: #fff; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: default; }
  #status { margin-top: 16px; font-size: 0.9rem; }
  a { color: #1a1a1a; }
</style>
</head>
<body>

<h1>Qualified EU Timestamps — coming soon</h1>
<p>A legally qualified (eIDAS) EU timestamp service is in development.
Leave your email and we'll let you know when it's available — no spam,
no other list.</p>

<form id="waitlist-form">
  <input type="email" id="email" placeholder="you@company.com" required>
  <button type="submit">Notify me</button>
</form>
<p id="status"></p>

<p style="margin-top:48px;"><a href="/">&larr; Back to EuroTSA</a></p>

<script>
  // Reads ?source= from the URL (set by the 429 response's link vs. the
  // plain footer link) so it's possible to see which conversion point
  // actually works, without any account/identity beyond the email itself.
  const params = new URLSearchParams(window.location.search);
  const source = params.get("source") || "waitlist_page";

  document.getElementById("waitlist-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value;
    const status = document.getElementById("status");
    const button = e.target.querySelector("button");
    button.disabled = true;
    status.textContent = "";
    try {
      const res = await fetch("https://signedby.ai/api/eurotsa-waitlist", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, source }),
      });
      if (res.ok) {
        status.textContent = "You're on the list — thanks.";
        e.target.reset();
      } else if (res.status === 429) {
        status.textContent = "Too many attempts — try again in a bit.";
      } else {
        status.textContent = "Something went wrong. Try again shortly.";
      }
    } catch {
      status.textContent = "Something went wrong. Try again shortly.";
    } finally {
      button.disabled = false;
    }
  });
</script>

</body>
</html>
